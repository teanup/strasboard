name: Deploy StrasBoard

on:
  push:
    branches: [main]
    paths: [web]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload web content
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy web content
        id: deployment
        uses: actions/deploy-pages@v5
